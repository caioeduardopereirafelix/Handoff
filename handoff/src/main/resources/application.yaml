spring:
  main:
    banner-mode: off

  # Lê o .env da raiz do repositório (ou da pasta atual), se existir.
  # Em produção, as mesmas chaves vêm de variáveis de ambiente.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:handoff}
    username: ${DB_USERNAME:handoff}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    locations:
      - classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:handoff}
    password: ${RABBITMQ_PASSWORD}
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 2s
          multiplier: 2

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

notifications:
  enabled: ${NOTIFICATIONS_ENABLED:true}
  from: ${MAIL_FROM:Handoff <nao-responda@handoff.local>}
  portal-base-url: ${PORTAL_BASE_URL:http://localhost:8080}

storage:
  endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
  region: ${STORAGE_REGION:us-east-1}
  bucket: ${STORAGE_BUCKET:handoff}
  access-key: ${STORAGE_ACCESS_KEY:}
  secret-key: ${STORAGE_SECRET_KEY:}
  fallback-access-key: ${MINIO_ROOT_USER:}
  fallback-secret-key: ${MINIO_ROOT_PASSWORD:}
  max-size-bytes: 10485760
  url-expiration: 5m

jwt:
  # Obrigatório, sem valor padrão: defina HANDOFF_JWT_SECRET (mínimo de 32 caracteres).
  key: ${HANDOFF_JWT_SECRET}
  expiration: 15m
  refresh-expiration: 7d
