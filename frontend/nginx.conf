map $request_uri $handoff_safe_uri {
    ~^(?<prefix>/(api/)?portal/)[^/?]+(?<rest>.*)$ $prefix***$rest;
    default $request_uri;
}

map $http_referer $handoff_safe_referer {
    ~^(?<prefix>.*/portal/)[^/?]+(?<rest>.*)$ $prefix***$rest;
    default $http_referer;
}

log_format handoff '$remote_addr - [$time_local] "$request_method $handoff_safe_uri $server_protocol" '
                   '$status $body_bytes_sent "$handoff_safe_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log handoff;
    client_max_body_size 1m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /handoff/ {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_pass http://minio:9000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
    }

    location / {
        try_files $uri /index.html;
        expires epoch;
    }
}
